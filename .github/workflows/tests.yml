# Runs the Voynich Viewer tests on GitHub: on every push to main, on every pull request, and by hand.
# What the tests are and how to read a failure: tests/README.md.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # Actions tab > Tests > Run workflow: any branch, and optionally only some tests, many times over
    inputs:
      grep:
        description: "Only the tests whose name or file name contains this, e.g. rearrange (case-sensitive). Empty: every test."
        required: false
        default: ""
      repeat:
        description: "Run each test this many times, with no retries (more than 1 hunts down a test that fails only sometimes)"
        required: false
        default: "1"

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true    # a newer push replaces a run that is still going

permissions:
  contents: read

env:
  SHARDS: 4                   # the browser tests are split over this many machines (keep it equal to the matrix below)

jobs:
  # Seconds, no browser: the data files, the page images, index.html and that every script parses.
  data-and-files:
    name: Data and files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:fast

  # The real site in a real browser (Chromium), on a desktop and on a phone, split over four machines so it takes minutes,
  # not half an hour: the 3D view is drawn in software there, which is slow.
  browser:
    name: Browser, part ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false        # one part failing still lets the others finish, so the report has every failure
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # the "old data" tests read earlier releases from git history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the browser
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - name: Run the tests
        env:
          GREP: ${{ inputs.grep }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          args=(--shard="${{ matrix.shard }}/$SHARDS" --reporter=blob,github,list)
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          if [[ "$REPEAT" =~ ^[0-9]+$ ]] && [ "$REPEAT" -gt 1 ]; then args+=(--repeat-each "$REPEAT" --retries 0); fi
          npx playwright test "${args[@]}"
      - name: Keep this part's results for the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

  # One report for all four parts, and one tick or cross: require this check (and "Data and files") on main.
  report:
    name: Site in a browser
    needs: browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Put the parts together into one report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Keep the report (screenshots and step-by-step traces of anything that failed)
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Pass only if every part passed
        if: ${{ needs.browser.result != 'success' }}
        run: |
          echo "::error::Some browser tests failed. Download the playwright-report artifact above and open index.html to see which, with screenshots and traces."
          exit 1
